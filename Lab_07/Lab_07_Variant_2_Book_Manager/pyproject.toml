[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "book-manager"
version = "0.7.0"
description = "Book catalog with SQLite, SQLAlchemy ORM, repositories and Alembic migrations"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
