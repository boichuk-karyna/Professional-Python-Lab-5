[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "books-persistence-lab7"
version = "0.7.0"
description = "Book catalog persistence layer: SQLite, SQLAlchemy, repositories and Alembic"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: tests integrating repositories, SQLAlchemy and SQLite"]
