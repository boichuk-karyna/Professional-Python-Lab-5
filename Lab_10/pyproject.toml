[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "book-catalog"
version = "1.0.0"
description = "Book catalog management application with REST API and database persistence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Karina Boichuk" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "build",
]

[project.scripts]
book-catalog = "book_catalog.main:main"
