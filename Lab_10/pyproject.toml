[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "book-catalog"
version = "1.0.0"
description = "Book catalog management application"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Karina Boichuk" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "build",
]

[project.scripts]
book-catalog = "book_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["book_catalog*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
