[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-catalog"
version = "1.0.0"
description = "Production-oriented book catalog REST API (Lab 10, variant 2)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Karyna Boichuk"}]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "pydantic-settings>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]

[project.scripts]
book-catalog = "book_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
