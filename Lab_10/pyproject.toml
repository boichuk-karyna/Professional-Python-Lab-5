[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-catalog"
version = "1.0.0"
description = "Production-oriented book catalog REST API for Lab 10, variant 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "pytest-cov>=5.0",
]

[project.scripts]
book-catalog = "book_catalog.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["book_catalog*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/previous_labs"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
